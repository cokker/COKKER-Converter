name: Windows x64
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest pyinstaller
      - name: Install media build tools
        run: |
          choco install ffmpeg innosetup --no-progress -y
          ffmpeg -version
      - name: Run conversion and UI tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q
      - name: Build portable app
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --onedir --name "COKKER Converter" --icon "assets/logo.ico" --add-data "assets;assets" --collect-all pillow_heif --collect-all pypdfium2 main.py
          New-Item -ItemType Directory -Force "dist/COKKER Converter/components"
          $ffmpeg = Get-ChildItem "$env:ChocolateyInstall/lib/ffmpeg/tools" -Recurse -File -Filter ffmpeg.exe | Select-Object -First 1
          if (-not $ffmpeg) { throw "Real FFmpeg binary missing" }
          $ffBin = $ffmpeg.Directory.FullName
          Copy-Item "$ffBin/ffmpeg.exe" "dist/COKKER Converter/components/ffmpeg.exe"
          Copy-Item "$ffBin/ffprobe.exe" "dist/COKKER Converter/components/ffprobe.exe"
          $ffRoot = Split-Path $ffBin -Parent
          Get-ChildItem $ffRoot -File | Where-Object { $_.Name -match '^(LICENSE|COPYING|README)' } | ForEach-Object { Copy-Item $_.FullName "dist/COKKER Converter/components/ffmpeg-$($_.Name)" }
          Copy-Item THIRD_PARTY_NOTICES.txt "dist/COKKER Converter/components/THIRD_PARTY_NOTICES.txt"
          New-Item -ItemType File "dist/COKKER Converter/portable.flag"
          Copy-Item LICENSE "dist/COKKER Converter/LICENSE-COKKER.txt"
          Compress-Archive -Path "dist/COKKER Converter" -DestinationPath "dist/COKKER-Converter-Portable-x64.zip" -Force
      - name: Smoke test packaged Windows app
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $p = Start-Process -FilePath "dist/COKKER Converter/COKKER Converter.exe" -ArgumentList "--self-test" -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "Packaged app smoke test failed: $($p.ExitCode)" }
      - name: Check icon embedded in portable EXE
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          $icon = [System.Drawing.Icon]::ExtractAssociatedIcon((Resolve-Path "dist/COKKER Converter/COKKER Converter.exe").Path)
          if (-not $icon) { throw "EXE icon missing" }
          $bitmap = $icon.ToBitmap()
          $corner = $bitmap.GetPixel(0, 0)
          $cutout = $bitmap.GetPixel([int]($bitmap.Width * 0.75), [int]($bitmap.Height * 0.75))
          $dragon = $bitmap.GetPixel([int]($bitmap.Width * 0.33), [int]($bitmap.Height * 0.55))
          Write-Host "EXE icon $($bitmap.Width)x$($bitmap.Height): corner alpha=$($corner.A), cutout alpha=$($cutout.A), dragon red=$($dragon.R)"
          if ($corner.A -gt 10 -or $cutout.A -gt 64 -or $dragon.A -lt 180 -or $dragon.R -lt 180) { throw "EXE contains a square background or an older icon" }
          $bitmap.Dispose(); $icon.Dispose()
      - name: Build installer
        shell: pwsh
        run: |
          Remove-Item "dist/COKKER Converter/portable.flag"
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "packaging/setup.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check icon embedded in setup EXE
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          $icon = [System.Drawing.Icon]::ExtractAssociatedIcon((Resolve-Path "dist/COKKER-Converter-Setup-x64.exe").Path)
          if (-not $icon) { throw "Setup icon missing" }
          $bitmap = $icon.ToBitmap()
          $corner = $bitmap.GetPixel(0, 0)
          $cutout = $bitmap.GetPixel([int]($bitmap.Width * 0.75), [int]($bitmap.Height * 0.75))
          $dragon = $bitmap.GetPixel([int]($bitmap.Width * 0.33), [int]($bitmap.Height * 0.55))
          Write-Host "Setup icon $($bitmap.Width)x$($bitmap.Height): corner alpha=$($corner.A), cutout alpha=$($cutout.A), dragon red=$($dragon.R)"
          if ($corner.A -gt 10 -or $cutout.A -gt 64 -or $dragon.A -lt 180 -or $dragon.R -lt 180) { throw "Setup contains a square background or an older icon" }
          $bitmap.Dispose(); $icon.Dispose()
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: COKKER-Converter-Windows-x64
          path: |
            dist/COKKER-Converter-Portable-x64.zip
            dist/COKKER-Converter-Setup-x64.exe
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $assets = @("dist/COKKER-Converter-Portable-x64.zip", "dist/COKKER-Converter-Setup-x64.exe")
          gh release view $env:GITHUB_REF_NAME --json tagName *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:GITHUB_REF_NAME $assets --clobber
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            gh release edit $env:GITHUB_REF_NAME --title "COKKER Converter $env:GITHUB_REF_NAME" --notes-file CHANGELOG.md --prerelease
          } else {
            gh release create $env:GITHUB_REF_NAME $assets --title "COKKER Converter $env:GITHUB_REF_NAME" --notes-file CHANGELOG.md --prerelease
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
